<!doctype html>
<!-- Render source for public/emails/microdose-header.png (see README.md). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'PP Neue Corp';
        font-weight: 750;
        src: url('../../public/fonts/PPNeueCorp-TightUltrabold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Graphik';
        font-weight: 500;
        src: url('../../public/fonts/Graphik-Medium.woff2') format('woff2');
      }
      * {
        margin: 0;
        padding: 0;
      }
      /* Figma 6970:2680 TopSection: 660x357, padding 24, content 550x253 at (24,52) */
      .section {
        width: 660px;
        height: 357px;
        box-sizing: border-box;
        padding: 52px 24px;
        background: #000;
      }
      .hero {
        width: 550px;
        height: 212px;
        color: #fff;
        font-family: 'PP Neue Corp', sans-serif;
        font-weight: 750;
        font-size: 120px;
        line-height: 105.6px;
        text-transform: uppercase;
      }
      /* Figma 6970:2678 Subhead: 550x29, 12px below headline */
      .subhead {
        width: 550px;
        height: 29px;
        margin-top: 12px;
        display: flex;
        align-items: center;
      }
      .subhead .a {
        width: 72px;
        padding-left: 9px;
        box-sizing: border-box;
        font-family: 'Graphik', sans-serif;
        font-weight: 500;
        font-size: 24px;
        line-height: 29px;
        letter-spacing: -0.48px;
        color: #fff;
      }
      .subhead img {
        width: 311px;
        height: 18.3px;
        display: block;
      }
      .subhead .nl {
        flex: 1;
        text-align: right;
        font-family: 'Graphik', sans-serif;
        font-weight: 500;
        font-size: 24px;
        line-height: 29px;
        letter-spacing: -0.48px;
        color: #fff;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="section">
      <div class="hero">Welcome to<br />The Microdose</div>
      <div class="subhead">
        <div class="a">A</div>
        <img src="../../public/superbloom-house-logo.svg" alt="" />
        <div class="nl">Newsletter</div>
      </div>
    </div>
  </body>
</html>
