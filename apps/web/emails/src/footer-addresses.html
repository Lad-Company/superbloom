<!doctype html>
<!-- Render source for public/emails/microdose-footer-addresses.png (see README.md). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'PP Neue Corp';
        font-weight: 750;
        src: url('../../public/fonts/PPNeueCorp-TightUltrabold.woff2') format('woff2');
      }
      * {
        margin: 0;
        padding: 0;
      }
      /* Figma 6970:2592 Addresses: 612x51, Label style 17/17 ls +2% uppercase */

        width: 612px;
        height: 51px;
        background: #fff;
        display: flex;
        justify-content: space-between;
        font-family: 'PP Neue Corp', sans-serif;
        font-weight: 750;
        font-size: 17px;
        line-height: 17px;
        letter-spacing: 0.34px;
        color: #000;
        text-transform: uppercase;
      }
      .nyc {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div>LA<br />5768 West Adams Blvd<br />Los Angeles, CA 90016</div>
      <div class="nyc">NYC<br />77 10th Street, Floor 3<br />Brooklyn, NY 11215</div>
    </div>
  </body>
