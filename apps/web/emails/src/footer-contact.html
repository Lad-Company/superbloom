<!doctype html>
<!-- Render source for public/emails/microdose-footer-{email,web,unsubscribe}.png
     (see README.md). e-mail x=0 and web x=295 keep Figma 6970:2600 positions;
     unsubscribe right-aligns (no phone word — numbers live in the addresses
     block above). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'PP Neue Corp';
        font-weight: 750;
        src: url('../../public/fonts/PPNeueCorp-TightUltrabold.woff2') format('woff2');
      }
      * {
        margin: 0;
        padding: 0;
      }
      /* Figma 6970:2600 Contact: 612x17, Label style, underlined */
      .row {
        position: relative;
        width: 612px;
        height: 17px;
        background: #fff;
        font-family: 'PP Neue Corp', sans-serif;
        font-weight: 750;
        font-size: 17px;
        line-height: 17px;
        letter-spacing: 0.34px;
        color: #000;
        text-transform: uppercase;
      }
      .row span {
        position: absolute;
        top: 0;
        text-decoration: underline;
        text-underline-position: from-font;
      }
      .email {
        left: 0;
      }
      .web {
        left: 295px;
      }
      .unsubscribe {
        right: 0;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="email">e-mail</span>
      <span class="web">web</span>
      <span class="unsubscribe">unsubscribe</span>
    </div>
  </body>
</html>
